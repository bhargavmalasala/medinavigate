<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Medinavigate</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css'>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-hospital"></i> MEDINAVIGATE
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <div class="contact-content">
                <h1>Contact Us</h1>
                <p class="tagline">We're here to help! Reach out to us for any questions or feedback.</p>
            </div>

            <div class="contact-form">
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Enter your message" rows="5" required></textarea>
                    </div>
                    <button type="submit">Send Message</button>
                </form>
            </div>

            <div class="contact-info">
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <h3>Address</h3>
                    <p>Vignan's Institute of Information Techonology, Duvvada, VSP</p>
                </div>
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <h3>Phone</h3>
                    <p>+91 9876543210</p>
                </div>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <h3>Email</h3>
                    <p>support@medinavigate.com</p>
                </div>
            </div>

            <div class="social-media">
                <h2>Follow Us</h2>
                <div class="social-icons">
                    <a href="#" class="social-icon"><i class="fi fi-brands-github"></i></a>
                    <a href="#" class="social-icon"><i class="fi fi-brands-linkedin"></i></a>
                    <a href="#" class="social-icon"><i class="fi fi-brands-youtube"></i></a>
                    <a href="#" class="social-icon"><i class="fi fi-brands-telegram"></i></a>
                </div>
            </div>

            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1598.0056753308431!2d83.1652042630064!3d17.710712769626394!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a3968cc9fe97785%3A0x6ebafe5de3375704!2sVignan%20CSE%20department!5e0!3m2!1sen!2sin!4v1724168401684!5m2!1sen!2sin"
                    width="100%"
                    height="400"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy">
                </iframe>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Medinavigate. All rights reserved.</p>
    </footer>
</body>
</html>
